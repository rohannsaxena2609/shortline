services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortline
      POSTGRES_USER: shortline
      POSTGRES_PASSWORD: shortline
    ports:
      - "5432:5432"
    volumes:
      - shortline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortline -d shortline"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shortline-postgres:
