spring:
  application:
    name: shortline
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/shortline}
    username: ${DATABASE_USERNAME:shortline}
    password: ${DATABASE_PASSWORD:shortline}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 50ms
      connect-timeout: 50ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shortline-analytics
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 500
        enable.idempotence: true
        acks: all
    listener:
      ack-mode: record
server:
  port: ${PORT:8080}
shortline:
  base-url: ${SHORTLINE_BASE_URL:http://localhost:8080}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
